<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻花女儿模拟器</title>
<style>
  :root{
    --bg:#0e0c0b;
    --bg2:#16120f;
    --panel:rgba(255,255,255,0.035);
    --text:#ded4c8;
    --dim:#8f857a;
    --warm:#c9855a;
    --warm-soft:#e0a97e;
    --cool:#7d9bb0;
    --line:rgba(255,255,255,0.08);
    --up:#7fb08a;
    --down:#c2705f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(201,133,90,0.10), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(125,155,176,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    line-height:1.95;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:820px;margin:0 auto;padding:0 22px 90px;}

  /* ---------- 顶栏 ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 12px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(to bottom, var(--bg) 62%, transparent);
  }
  .brand{
    font-size:13px;letter-spacing:.32em;color:var(--dim);
    text-transform:none;
  }
  .ghost-btn{
    background:none;border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:12px;letter-spacing:.1em;
    padding:6px 14px;border-radius:999px;cursor:pointer;
    transition:.25s;
  }
  .ghost-btn:hover{color:var(--warm-soft);border-color:rgba(201,133,90,.45);}

  /* ---------- 属性 ---------- */
  #stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px 20px;
    padding:16px 18px;
    margin-bottom:26px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    animation:fade .4s ease;
  }
  .stat{font-size:11.5px;letter-spacing:.05em;}
  .stat-top{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:5px;}
  .stat-top .v{color:var(--text);font-variant-numeric:tabular-nums;}
  .bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.3,.9,.3,1);}
  .stat.in .bar i{background:linear-gradient(90deg,#8a5c3c,var(--warm-soft));}
  .stat.out .bar i{background:linear-gradient(90deg,#4a6478,var(--cool));}

  /* ---------- 通用 ---------- */
  .hidden{display:none!important;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .fade{animation:fade .75s ease both;}

  .btn{
    font-family:inherit;font-size:14.5px;letter-spacing:.06em;
    background:none;border:1px solid var(--line);color:var(--text);
    padding:12px 22px;border-radius:8px;cursor:pointer;
    transition:.28s;text-align:left;
  }
  .btn:hover{border-color:rgba(201,133,90,.5);background:rgba(201,133,90,.06);}
  .btn.primary{border-color:rgba(201,133,90,.5);color:var(--warm-soft);}
  .btn.primary:hover{background:rgba(201,133,90,.12);}

  /* ---------- 封面 ---------- */
  .cover{padding:8vh 0 40px;}
  .cover-line{
    font-size:16.5px;color:var(--text);margin-bottom:20px;
    opacity:0;animation:fade 1.4s ease forwards;
  }
  .cover-line .sub{display:block;color:var(--dim);font-size:13px;letter-spacing:.16em;margin-top:6px;}
  .cover-title{
    font-size:30px;letter-spacing:.22em;color:var(--warm-soft);
    margin:56px 0 10px;font-weight:400;
    opacity:0;animation:fade 1.6s ease 2.4s forwards;
  }
  .cover-sub{
    font-size:12px;letter-spacing:.26em;color:var(--dim);margin-bottom:52px;
    opacity:0;animation:fade 1.6s ease 2.9s forwards;
  }
  .cover-btn{opacity:0;animation:fade 1.4s ease 3.5s forwards;}

  /* ---------- 扫描 ---------- */
  .scan-box{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:2.1;color:var(--dim);
    background:rgba(0,0,0,.32);border:1px solid var(--line);
    border-radius:10px;padding:20px 22px;margin:6vh 0 26px;
    white-space:pre-wrap;
  }
  .scan-box .ok{color:var(--warm-soft);}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--warm-soft);
    vertical-align:-2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- 角色创建 ---------- */
  .q-wrap{padding:5vh 0;}
  .q-index{font-size:11.5px;letter-spacing:.24em;color:var(--dim);margin-bottom:14px;}
  .q-title{font-size:20px;margin-bottom:8px;color:var(--text);font-weight:400;letter-spacing:.05em;}
  .q-desc{font-size:13px;color:var(--dim);margin-bottom:30px;}
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{
    font-family:inherit;font-size:15px;text-align:left;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:15px 20px;border-radius:9px;cursor:pointer;transition:.26s;
  }
  .opt:hover{border-color:rgba(201,133,90,.5);background:rgba(201,133,90,.07);transform:translateX(3px);}
  .opt small{display:block;font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:.04em;}

  .text-input{
    width:100%;font-family:inherit;font-size:15.5px;color:var(--text);
    background:rgba(0,0,0,.3);border:1px solid var(--line);
    border-radius:9px;padding:15px 18px;outline:none;transition:.25s;
    margin-bottom:14px;
  }
  .text-input:focus{border-color:rgba(201,133,90,.55);background:rgba(0,0,0,.45);}
  .text-input::placeholder{color:#5f574f;}

  /* ---------- 剧情 ---------- */
  .chapter{padding-top:4px;animation:fade .9s ease both;}
  .ch-meta{font-size:11px;letter-spacing:.24em;color:var(--warm);margin-bottom:14px;}
  .ch-title{font-size:23px;font-weight:400;letter-spacing:.08em;margin-bottom:8px;color:#efe5d8;}
  .ch-scene{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-bottom:34px;
    padding-bottom:22px;border-bottom:1px solid var(--line);}

  .prose p{margin-bottom:22px;font-size:16.5px;color:#d6ccc0;letter-spacing:.015em;}
  .prose p:last-child{margin-bottom:0;}

  .choices{margin-top:44px;animation:fade .8s ease both;}
  .choices-title{font-size:12px;letter-spacing:.24em;color:var(--dim);margin-bottom:16px;}
  .choice{
    display:block;width:100%;font-family:inherit;font-size:15px;text-align:left;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:15px 20px;border-radius:9px;cursor:pointer;transition:.26s;
    margin-bottom:11px;line-height:1.7;
  }
  .choice:hover{border-color:rgba(201,133,90,.5);background:rgba(201,133,90,.07);transform:translateX(3px);}
  .choice .tag{color:var(--dim);font-size:12px;margin-left:6px;}

  .result{margin-top:34px;animation:fade .8s ease both;}
  .result-prose p{margin-bottom:20px;font-size:16px;color:#cfc5b8;}
  .deltas{display:flex;flex-wrap:wrap;gap:9px;margin:26px 0 32px;}
  .deltas span{font-size:12.5px;letter-spacing:.06em;padding:5px 13px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.02);}
  .deltas .up{color:var(--up);border-color:rgba(127,176,138,.3);}
  .deltas .down{color:var(--down);border-color:rgba(194,112,95,.3);}

  /* ---------- 阶段总结 ---------- */
  .summary-box{
    border-left:2px solid rgba(201,133,90,.5);
    padding:6px 0 6px 24px;margin:8px 0 30px;
  }
  .summary-item{margin-bottom:22px;}
  .summary-item h4{font-size:12px;letter-spacing:.2em;color:var(--warm);font-weight:400;margin-bottom:8px;}
  .summary-item p{font-size:15.5px;color:#cfc5b8;}

  /* ---------- 结局 ---------- */
  .ending{text-align:center;padding:8vh 0 40px;animation:fade 1.4s ease both;}
  .ending-tag{font-size:11px;letter-spacing:.4em;color:var(--dim);margin-bottom:18px;}
  .ending-title{font-size:28px;letter-spacing:.18em;color:var(--warm-soft);margin-bottom:44px;font-weight:400;}
  .ending-prose{text-align:left;max-width:640px;margin:0 auto 50px;}
  .ending-prose p{margin-bottom:22px;font-size:16.5px;color:#d6ccc0;}

  .free-wrap{margin-top:6px;}
  .center{text-align:center;}
  .mt{margin-top:30px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="hidden">
    <div class="brand">幻花女儿模拟器</div>
    <button id="statToggle" class="ghost-btn">属性 ▾</button>
  </div>
  <div id="stats" class="hidden"></div>
  <main id="stage"></main>
</div>

<script>
/* ============================================================
   基础数据
   ============================================================ */
const ATTRS = [
  {k:'family',   n:'家庭凝聚力',   g:'in'},
  {k:'love',     n:'父母感情值',   g:'in'},
  {k:'presence', n:'女儿存在感',   g:'in'},
  {k:'risk',     n:'秘密危险度',   g:'out'},
  {k:'alert',    n:'平台运营警觉度', g:'out'},
  {k:'fan',      n:'粉丝舆论压力', g:'out'},
  {k:'career',   n:'事业压力',     g:'out'},
];

const S = {
  name:'', stage:'', personality:'', pacing:'',
  idx:0, attrs:{}, flags:{}, plugin:false,
};

const stageEl = () => document.getElementById('stage');
const rand = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const clamp = v => Math.max(0, Math.min(100, v));
const nameOf = k => (ATTRS.find(a=>a.k===k)||{}).n || k;

function fmt(t){
  return t.replace(/\{name\}/g, S.name || '小满')
          .split('\n\n')
          .map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`)
          .join('');
}
function scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}); }

/* ============================================================
   属性面板
   ============================================================ */
function renderStats(){
  const box = document.getElementById('stats');
  box.innerHTML = ATTRS.map(a=>{
    const v = S.attrs[a.k] ?? 0;
    return `<div class="stat ${a.g}">
      <div class="stat-top"><span>${a.n}</span><span class="v">${v}</span></div>
      <div class="bar"><i style="width:${v}%"></i></div>
    </div>`;
  }).join('');
}

document.getElementById('statToggle').onclick = ()=>{
  document.getElementById('stats').classList.toggle('hidden');
};

/* ============================================================
   封面
   ============================================================ */
const COVER_LINES = [
  ['上海福利院走廊，傍晚六点四十分。', '橘色窗光斜切过地砖'],
  ['出租公寓玄关，摆着一双小小的童鞋。', '鞋头朝着门'],
  ['隔音墙两侧，两个人背靠背坐着。', '谁也没有先开口'],
  ['商务车后座，蜷着一只小小的手。', '窗外是外滩的晚风'],
];

function boot(){
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('stats').classList.add('hidden');
  const st = stageEl();
  st.innerHTML = `<div class="cover">
    ${COVER_LINES.map((l,i)=>`
      <div class="cover-line" style="animation-delay:${i*0.55+0.3}s">${l[0]}<span class="sub">${l[1]}</span></div>
    `).join('')}
    <h1 class="cover-title">幻花女儿模拟器</h1>
    <div class="cover-sub">家产女儿 · 定向文字模拟</div>
    <div class="cover-btn"><button class="btn primary" id="startBtn">进入 →</button></div>
  </div>`;
  document.getElementById('startBtn').onclick = pluginCheck;
}

/* ============================================================
   插件检查
   ============================================================ */
function pluginCheck(){
  const st = stageEl();
  st.innerHTML = `<div class="scan-box" id="scanBox"></div>`;
  const box = document.getElementById('scanBox');
  const lines = [
    '> 扫描插件接口区域 ...',
    '> /plugin/mohuan_hs ······ <span class="ok">存在非空白字符</span>',
    '> /plugin/emotion_engine ·· <span class="ok">存在非空白字符</span>',
    '> 检测完成。',
  ];
  let i = 0;
  const timer = setInterval(()=>{
    if(i < lines.length){
      box.innerHTML += lines[i] + '\n';
      i++;
    }else{
      clearInterval(timer);
      box.innerHTML += '<span class="cursor"></span>';
      setTimeout(askPlugin, 700);
    }
  }, 420);
}

function askPlugin(){
  const st = stageEl();
  st.innerHTML += `
    <div class="q-wrap fade">
      <div class="q-index">SYSTEM</div>
      <div class="q-title">是否使用插件？</div>
      <div class="q-desc">插件会为叙事提供额外的情绪与氛围提示。</div>
      <div class="opts">
        <button class="opt" data-p="1">是<small>加载插件，叙事将带有更细的情绪层</small></button>
        <button class="opt" data-p="0">否<small>以纯净模式开始</small></button>
      </div>
    </div>`;
  st.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      S.plugin = b.dataset.p === '1';
      startCharCreate();
    };
  });
}

/* ============================================================
   角色创建
   ============================================================ */
const QUESTIONS = [
  {
    key:'stage',
    title:'起点年龄段',
    desc:'你从这个年纪开始，被看见。',
    options:[
      {v:'婴儿期', t:'婴儿期（0-2岁）', s:'你没有记忆，但他们记得所有细节'},
      {v:'懵懂期', t:'懵懂期（5-7岁）', s:'你开始拥有清晰记忆'},
      {v:'青春期', t:'青春期（13-15岁）', s:'所有真相你都看懂，却不能对外言说'},
      {v:'成年初期', t:'成年初期（18-19岁）', s:'你拥有自主选择立场的完整能力'},
    ]
  },
  {
    key:'name',
    title:'女儿名字',
    desc:'某幻翻了一整夜字典取的名字。',
    type:'text',
    placeholder:'输入中文名或昵称……',
    presets:['小满','念念','年年','小酒'],
  },
  {
    key:'personality',
    title:'女儿性格倾向',
    desc:'你在家里，是一个什么样的小孩。',
    options:[
      {v:'安静观察型', t:'安静观察型', s:'你习惯先看，再说话'},
      {v:'主动守护型', t:'主动守护型', s:'你总想替他们挡住一点什么'},
      {v:'叛逆探索型', t:'叛逆探索型', s:'你不太愿意活在被安排好的缝隙里'},
      {v:'__custom', t:'自定义', s:'自己写一个'},
    ]
  },
  {
    key:'pacing',
    title:'剧情节奏偏好',
    desc:'你想要怎样被讲述。',
    options:[
      {v:'慢热细腻', t:'慢热细腻', s:'把每一顿饭、每一盏灯都过一遍'},
      {v:'张力优先', t:'张力优先', s:'危机来得更早，也更锋利'},
      {v:'均衡推进', t:'均衡推进', s:'温柔与酸涩交替'},
      {v:'现实舆论向', t:'现实舆论向', s:'镜头、弹幕、热搜，一直在场'},
      {v:'__custom', t:'自定义', s:'自己写一个'},
    ]
  }
];

let qIndex = 0;

function startCharCreate(){
  qIndex = 0;
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[qIndex];
  const st = stageEl();
  let body = '';

  if(q.type === 'text'){
    body = `
      <input class="text-input" id="qInput" placeholder="${q.placeholder}" autocomplete="off">
      <div class="opts">
        ${q.presets.map(p=>`<button class="opt" data-name="${p}">${p}<small>使用这个</small></button>`).join('')}
      </div>
      <div class="mt"><button class="btn primary" id="qNext">确认 →</button></div>`;
  }else{
    body = `<div class="opts">
      ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}<small>${o.s}</small></button>`).join('')}
    </div>`;
  }

  st.innerHTML = `<div class="q-wrap fade">
    <div class="q-index">0${qIndex+1} / 0${QUESTIONS.length}</div>
    <div class="q-title">${q.title}</div>
    <div class="q-desc">${q.desc}</div>
    ${body}
  </div>`;

  if(q.type === 'text'){
    const input = document.getElementById('qInput');
    st.querySelectorAll('[data-name]').forEach(b=>{
      b.onclick = ()=>{ input.value = b.dataset.name; };
    });
    document.getElementById('qNext').onclick = ()=>{
      const v = (input.value || '').trim();
      if(!v){ input.focus(); input.style.borderColor='rgba(194,112,95,.7)'; return; }
      S[q.key] = v;
      nextQuestion();
    };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('qNext').click(); });
  }else{
    st.querySelectorAll('[data-i]').forEach(b=>{
      b.onclick = ()=>{
        const o = q.options[+b.dataset.i];
        if(o.v === '__custom'){
          customAnswer(q);
        }else{
          S[q.key] = o.v;
          nextQuestion();
        }
      };
    });
  }
  scrollTop();
}

function customAnswer(q){
  const st = stageEl();
  st.innerHTML = `<div class="q-wrap fade">
    <div class="q-index">0${qIndex+1} / 0${QUESTIONS.length}</div>
    <div class="q-title">${q.title}</div>
    <div class="q-desc">写下你自己的答案。</div>
    <input class="text-input" id="qInput" placeholder="例如：安静但爱记仇的小孩" autocomplete="off">
    <button class="btn primary" id="qNext">确认 →</button>
  </div>`;
  const input = document.getElementById('qInput');
  document.getElementById('qNext').onclick = ()=>{
    const v = (input.value||'').trim();
    if(!v){ input.focus(); return; }
    S[q.key] = v;
    nextQuestion();
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('qNext').click(); });
  input.focus();
}

function nextQuestion(){
  qIndex++;
  if(qIndex < QUESTIONS.length) renderQuestion();
  else startGame();
}

/* ============================================================
   开局
   ============================================================ */
function startGame(){
  // 初始属性
  S.attrs = {
    family: rand(10,28),
    love: 50,
    presence: S.stage === '懵懂期' ? 10 : rand(10,50),
    risk: rand(10,28),
    alert: 50,
    fan: rand(10,28),
    career: 60,
  };
  S.flags = {};
  S.idx = ({ '婴儿期':0, '懵懂期':4, '青春期':8, '成年初期':13 })[S.stage] ?? 0;

  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('stats').classList.remove('hidden');
  renderStats();
  renderChapter();
}

/* ============================================================
   章节数据
   ============================================================ */
const CHAPTERS = [

/* ---------- 婴儿期 ---------- */
{
  type:'chapter', stage:'婴儿期', act:'第一幕 · 被选择',
  title:'名字的重量', scene:'福利院走廊',
  text:`福利院走廊尽头的窗开着一半，傍晚的橘色光斜切进来，在地砖上划出一道明暗交界。

花少北抱着你坐在长椅上，手臂绷得很紧，掌心却放得极轻，像捧着一件会呼吸的、怕碎的东西。

"你别绷这么紧，后背全是汗。"某幻站在一旁低声笑他。

"我没有紧张。"花少北嘴硬反驳，手臂却又往回收了收，低头看你。

你四个月大，看不了太远。视野里只有两个模糊的轮廓，一个离得很近，一个稍远一点，都停在光里。

"你知道自己叫什么吗？"他的拇指轻轻蹭过你的脸颊。

{name}——是某幻翻了一整夜字典取的。

"我是谁呀？"花少北的额头轻轻抵住你的小额头，声音软下来，"我是花少北，以后你想叫我什么都可以。爸爸、小北、少北，都行。"

某幻在旁边无奈叹气："你直接让孩子喊你名字？"

"她才四个月，话都说不清！"花少北抬眼怼回去，"我不想逼她，等她自己愿意开口再叫就好。"

后来他又低下头，慢慢讲起取名的那个凌晨——四点十七分，某幻发消息问他这个名字好不好，一个字一个字地解释寓意。他随口答应了，对方开心到一整晚没睡，第二天煮咖啡递杯子的时候，嘴角一直扬着。

你听不懂。

但你抓住了他的手指。`,
  options:[
    {
      label:'攥住他的手指，怎么都不肯松开',
      effects:{family:6, love:4, presence:6},
      result:`花少北整个人僵了一瞬，随即低头，眼睛亮得有点不像话。

  text:`某天晚饭，花少北刷着机票页面随口出声："我订了去韩国的机票。"

花少北指尖划着屏幕，嘴角悄悄扬起一点，自己都没察觉。

出发前一晚，你整理行李箱时翻出一张压在相册底层的旧照片——早年去哔哩哔哩美丽小学时拍的，云南，两个人，都还很年轻。

十二月的江原道飘着细雪。

走出车站，寒风卷着雪落在肩头。花少北压着针织帽抬头望向远处覆雪的牧场，站在原地静静看了很久，像是终于抵达了搁置多年的心愿。

/* ============================================================
   章节渲染
   ============================================================ */
function renderChapter(){
  // 查找下一章有效章节
  while(S.idx < CHAPTERS.length){
    const ch = CHAPTERS[S.idx];
    if(ch.cond && !ch.cond(S)) { S.idx++; continue; }
    break;
  }
  if(S.idx >= CHAPTERS.length){ resolveEnding(); return; }

  const ch = CHAPTERS[S.idx];
  const st = stageEl();

  if(ch.type === 'summary'){
    st.innerHTML = `<div class="chapter">
      <div class="ch-meta">${ch.stage} · 阶段总结</div>
      <div class="ch-title">${ch.title}</div>
      <div class="ch-scene">记忆归档</div>
      <div class="summary-box">
        ${ch.items.map(([h,p])=>`<div class="summary-item"><h4>${h}</h4><p>${fmt(p)}</p></div>`).join('')}
      </div>
      <button class="btn primary" id="contBtn">继续 →</button>
    </div>`;
    document.getElementById('contBtn').onclick = ()=>{ S.idx++; renderChapter(); };
    scrollTop();
    return;
  }

  st.innerHTML = `<div class="chapter">
    <div class="ch-meta">${ch.act} · ${ch.stage}</div>
    <div class="ch-title">${ch.title}</div>
    <div class="ch-scene">当前场景：${ch.scene}</div>
    <div class="prose">${fmt(ch.text)}</div>
    <div class="choices">
      <div class="choices-title">【请选择】</div>
      <div id="choiceList"></div>
    </div>
  </div>`;

  const list = document.getElementById('choiceList');
  ch.options.forEach((o, i)=>{
    const label = o.free ? '自由输入' : o.label;
    const prefix = o.free ? 'D' : String.fromCharCode(65+i);
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<b>${prefix}.</b> ${label}`;
    b.onclick = ()=> o.free ? renderFreeInput(ch) : pickOption(o);
    list.appendChild(b);
  });

  scrollTop();
  renderStats();
}

/* ============================================================
   选择处理
   ============================================================ */
function pickOption(opt){
  const deltas = [];
  if(opt.effects){
    for(const k in opt.effects){
      const before = S.attrs[k];
      S.attrs[k] = clamp(before + opt.effects[k]);
      const d = S.attrs[k] - before;
      if(d !== 0) deltas.push({k, d});
    }
  }
  if(opt.flag) S.flags[opt.flag] = true;

  renderStats();

  const wrap = document.querySelector('.choices');
  wrap.innerHTML = `<div class="result">
    <div class="result-prose">${fmt(opt.result)}</div>
    ${deltas.length ? `<div class="deltas">${deltas.map(d=>
      `<span class="${d.d>0?'up':'down'}">${nameOf(d.k)} ${d.d>0?'↑':'↓'}${Math.abs(d.d)}</span>`
    ).join('')}</div>` : ''}
    <button class="btn primary" id="contBtn">继续 →</button>
  </div>`;

  document.getElementById('contBtn').onclick = ()=>{ S.idx++; renderChapter(); };
  document.getElementById('contBtn').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ============================================================
   自由输入
   ============================================================ */
function renderFreeInput(ch){
  const wrap = document.querySelector('.choices');
  wrap.innerHTML = `<div class="free-wrap fade">
    <input class="text-input" id="freeInput" placeholder="写下你此刻想做的事、想说的话……" autocomplete="off">
    <button class="btn primary" id="freeBtn">确认 →</button>
  </div>`;
  const input = document.getElementById('freeInput');
  input.focus();
  document.getElementById('freeBtn').onclick = ()=> doFree(input.value, ch);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doFree(input.value, ch); });
  input.scrollIntoView({behavior:'smooth', block:'center'});
}

function doFree(raw, ch){
  const v = (raw||'').trim();
  if(!v){ document.getElementById('freeInput').focus(); return; }

  // 关键词推演
  let reply, effects;
  if(/抱|搂|依偎|靠|牵|握/.test(v)){
    reply = `你走过去，做了那个动作。

空气安静了一瞬，然后是衣料摩擦的声音，是很轻的呼吸声。

没有人问为什么。有些时候，语言是多余的。`;
    effects = {family:6, love:5, presence:5};
  }else if(/说|问|告诉|喊|叫/.test(v)){
    reply = `你把那句话说了出来。

声音不大，但在安静的房间里，每个字都听得很清楚。

花少北先看着你，眼神里有点意外，又有点别的什么。某幻没有说话，只是把手放在了你肩上，很轻地按了一下。

后来谁也没有再提这件事。但你知道，他们都记住了。`;
    effects = {family:4, love:3, presence:5};
  }else if(/哭|眼泪|难过|心疼/.test(v)){
    reply = `眼泪比想象中来得快。

花少北一下子慌了，手忙脚乱地去找纸巾，某幻已经先一步蹲下来，把你抱住。

"没事。"他说，"没事的。"

花少北也蹲了下来，两个人一左一右，把你围在中间。

那天之后，家里的灯关得晚了一点。`;
    effects = {family:5, love:4, presence:6};
  }else if(/跑|走|离开|出去|一个人/.test(v)){
    reply = `你转身走了出去。

身后有人叫了你的名字，你没有回头。

楼道里的声控灯一盏一盏地亮起来，又一盏一盏地灭下去。

你在楼下站了很久，直到风把脸吹得有点凉。

后来，你听见脚步声从楼道里传出来。`;
    effects = {presence:3, family:-3, love:-1};
  }else if(/沉默|不说|安静|看/.test(v)){
    reply = `你什么也没做，只是安静地待在那里。

有时候，这已经是一种回应。

房间里的空气慢慢松下来，像绷紧的弦被轻轻放开了。

某幻看了你一眼，花少北也看了你一眼，都没有说话。`;
    effects = {presence:4, family:3, love:2};
  }else{
    reply = `你那么做了。

房间里安静了几秒。

某幻和花少北对视了一眼，谁都没有立刻说话。后来花少北轻轻笑了一下，某幻低下头，继续做手里的事，只是动作慢了一点。

这一天就这么过去了，和往常没有太大分别。`;
    effects = {presence:3, family:2};
  }

  const deltas = [];
  for(const k in effects){
    const before = S.attrs[k];
    S.attrs[k] = clamp(before + effects[k]);
    const d = S.attrs[k] - before;
    if(d) deltas.push({k, d});
  }
  renderStats();

  const wrap = document.querySelector('.choices');
  wrap.innerHTML = `<div class="result">
    <div class="result-prose" style="color:var(--dim);font-style:italic;font-size:14px;margin-bottom:18px;">「${v}」</div>
    <div class="result-prose">${fmt(reply)}</div>
    ${deltas.length ? `<div class="deltas">${deltas.map(d=>
      `<span class="${d.d>0?'up':'down'}">${nameOf(d.k)} ${d.d>0?'↑':'↓'}${Math.abs(d.d)}</span>`
    ).join('')}</div>` : ''}
    <button class="btn primary" id="contBtn">继续 →</button>
  </div>`;

  document.getElementById('contBtn').onclick = ()=>{ S.idx++; renderChapter(); };
  document.getElementById('contBtn').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ============================================================

function resolveEnding(){
  const a = S.attrs;
  const f = S.flags;
  let key = 'HIDDEN';

  // BE：秘密危险度与平台警觉度双高，且感情尚存
  if(a.risk >= 90 && a.alert >= 90 && a.love > 50){
    key = 'BE';
  }
  // HE：自媒体道路 + 高存在感
  else if(f.media && a.presence >= 90 && a.love >= 70 && a.family >= 80){
    key = 'HE';
  }
  // TE：普通道路 + 各项均衡良好
  else if(!f.media && a.family >= 80 && a.love >= 70 && a.risk < 50 && a.presence >= 70){
    key = 'TE';
  }
  // OE：离开 + 家庭凝聚力低
  else if(f.leave && a.family < 50 && a.love >= 40 && a.risk >= 30){
    key = 'OE';
  }
  // 保底推演
  else if(a.family < 20){
    key = 'BE';
  }
  else if(f.leave && a.family < 55){
    key = 'OE';
  }

  const e = ENDINGS[key];
  const st = stageEl();
  document.getElementById('stats').classList.add('hidden');

  st.innerHTML = `<div class="ending">
    <div class="ending-tag">${e.tag}</div>
    <h1 class="ending-title">${e.title}</h1>
    <div class="ending-prose">${fmt(e.text)}</div>
    <div class="center">
      <button class="btn primary" id="restartBtn">重新开始</button>
    </div>
  </div>`;

  document.getElementById('restartBtn').onclick = ()=> location.reload();
  scrollTop();
}
